name: connector-bump

# Keep the add-on pinned to the latest published Airlock connector image and cut a new
# add-on release when that image changes. Home Assistant rebuilds an add-on only on a
# version bump, so this is what propagates a new connector to installed add-ons.
# Self-contained: pushes with the repo's own GITHUB_TOKEN — no cross-repo secret.
#
# For instant (rather than daily) propagation, Airlock's build-images workflow could
# fire a repository_dispatch at this repo after publishing the connector — that needs a
# PAT with contents:write here. The daily schedule is the tokenless fallback.
on:
  # Daily auto-bump. Gated against the v1.0.3 segfault-ship class: build-images.yml
  # promotes :latest only after its own smoke test, and this workflow re-verifies
  # (cosign + smoke) before releasing. NOTE: a bump updates only the add-on — after
  # one, manually sync airlock main.yml + apps/deploy (connector digest) and
  # airlock_connector_version (the new build's git sha) so the dashboard stays right.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: connector-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # run the arm64 image variant under emulation

      - name: Resolve latest connector digest
        id: resolve
        run: |
          set -euo pipefail
          repo=pbiester/airlock-connector
          tok=$(curl -fsSL "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
          digest=$(curl -fsSL -o /dev/null -D - \
            -H "Authorization: Bearer $tok" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/latest" \
            | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}' | tr -d '\r')
          if [ -z "$digest" ]; then echo "::error::could not resolve connector digest"; exit 1; fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify connector signature (cosign keyless)
        env:
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          # The connector is cosign keyless-signed by the airlock repo's
          # build-images workflow. Verify the resolved digest BEFORE trusting it:
          # if :latest were ever repointed to an unsigned or foreign image, fail
          # the bump instead of auto-pinning + releasing a bad digest to every
          # installed add-on. Pins the signing workflow identity + OIDC issuer.
          curl -fsSL -o /usr/local/bin/cosign \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/pbiester/airlock/\.github/workflows/build-images\.yml@refs/.+$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "ghcr.io/pbiester/airlock-connector@${DIGEST}" > /dev/null
          echo "Signature verified for ${DIGEST}"

      - name: Smoke test the connector image (no crash on startup)
        env:
          REF: ghcr.io/pbiester/airlock-connector@${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          repo="${REF%@*}"
          # Address each arch's single-platform child digest: running a multi-arch index
          # by digest with --platform hits the containerd "cannot overwrite digest" error.
          raw="$(docker buildx imagetools inspect "$REF" --raw)"
          is_crash() { case "$1" in 132|133|134|135|136|137|139) return 0 ;; *) return 1 ;; esac; }
          for arch in amd64 arm64; do
            d="$(printf '%s' "$raw" | jq -r --arg a "$arch" \
              '.manifests[] | select(.platform.architecture==$a and .platform.os=="linux") | .digest' | head -1)"
            [ -n "$d" ] || { echo "::error::no linux/${arch} manifest"; exit 1; }
            cref="${repo}@${d}"
            # frpc is the binary that segfaulted in prod; --version must exit 0 (set -e
            # fails the bump on a segfault/panic, so a bad image is never released).
            docker run --rm --platform "linux/$arch" --entrypoint /usr/local/bin/frpc "$cref" --version
            # The connector itself must start without a signal-crash (no config => it
            # errors/waits, both fine).
            rc=0; timeout 8 docker run --rm --platform "linux/$arch" "$cref" >/dev/null 2>&1 || rc=$?
            if is_crash "$rc"; then echo "::error::connector crashed on linux/${arch} (exit ${rc})"; exit 1; fi
            echo "linux/${arch}: ok (exit ${rc})"
          done

      - name: Repin + release if the digest changed
        env:
          NEW: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          dockerfile=airlock-connector/Dockerfile
          config=airlock-connector/config.yaml
          changelog=airlock-connector/CHANGELOG.md

          cur=$(grep -oE 'airlock-connector@sha256:[a-f0-9]+' "$dockerfile" | head -1 | cut -d@ -f2 || true)
          if [ "$cur" = "$NEW" ]; then
            echo "Already pinned to ${NEW} — nothing to do."
            exit 0
          fi

          # 1) repin the Dockerfile (matches an existing @sha256:... or :tag)
          sed -i -E "s#(ghcr\.io/pbiester/airlock-connector)(@sha256:[a-f0-9]+|:[A-Za-z0-9._-]+)#\1@${NEW}#" "$dockerfile"

          # 2) bump the semver patch so HA flags an update (same scheme → comparable)
          curv=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?/\1/p' "$config")
          IFS=. read -r MA MI PA <<< "$curv"
          ver="${MA}.${MI}.$((PA + 1))"
          sed -i -E "s/^version:.*/version: \"${ver}\"/" "$config"

          # 3) prepend a changelog entry
          tmp=$(mktemp)
          {
            printf '# Changelog\n\n## %s\n\n- Update connector image to `%s`.\n' "$ver" "$NEW"
            tail -n +2 "$changelog"
          } > "$tmp"
          mv "$tmp" "$changelog"

          git config user.name "airlock-bot"
          git config user.email "contact@isonet.fr"
          git add "$dockerfile" "$config" "$changelog"
          git commit -m "addon: bump connector image to ${NEW} (v${ver})"
          git push
          echo "Released v${ver} pinned to ${NEW}"
